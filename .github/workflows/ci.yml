name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck every workspace against the pinned Pi version. This is the gate
      # Renovate's auto-merge waits on: a Pi bump that breaks a type fails here
      # before it can land.
      - run: npm run check
