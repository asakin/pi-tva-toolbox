name: Publish

# Publishes every package in this repo to npm when a GitHub release is
# published: the lib first, then each extension, then the umbrella that bundles
# them. Versions move in lockstep (npm run version:set), so the release tag is
# the version of all of them. A package whose version is already on the
# registry is skipped, so a re-run after a partial failure publishes the rest.
on:
  release:
    types: [published]

# Trusted publishing: npm authenticates this job by its OIDC token, so there is
# no long-lived NPM_TOKEN secret. Each package's trusted publisher (GitHub
# Actions, this repo, workflow file publish.yml) is configured in that package's
# own npmjs.com settings, which exist only after its first publish — so the
# first publish of every package is manual. Requires npm >= 11.5.1; the Node 26
# toolchain below ships newer.
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      # The release tag must be the lockstep version, so a tag never ships a
      # manifest that disagrees with it.
      - run: |
          want="v$(npm pkg get version | tr -d '"')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package version $want"; exit 1; }
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Publish lib, extensions, then the umbrella
        run: |
          set -euo pipefail
          publish() { # $1 = workspace dir, or "." for the umbrella root
            local dir="$1" name version
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on the registry)"
              return
            fi
            if [ "$dir" = "." ]; then npm publish; else npm publish -w "$dir"; fi
          }
          publish lib
          for d in extensions/*/; do publish "${d%/}"; done
          publish .
