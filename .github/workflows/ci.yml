name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the code to typecheck it.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # --ignore-scripts: typechecking needs the .d.ts files, not the deps'
      # install scripts. Skipping them keeps untrusted postinstall code from
      # running on the runner.
      - run: npm ci --ignore-scripts
      - run: npm run check
