version: 2
updates:
  - package-ecosystem: npm
    # "/" is the workspace root; Dependabot walks the workspaces and updates
    # the pinned version in every extension's package.json.
    directory: /
    schedule:
      interval: weekly
    # Let a release age before proposing it, so a compromised or broken publish
    # has time to be caught and yanked. Longer hold for majors. Does NOT apply to
    # security updates -- those still come fast, by design.
    cooldown:
      default-days: 3
      semver-major-days: 14
    groups:
      # One grouped PR for the Pi bump across all workspaces, instead of three.
      pi-coding-agent:
        patterns:
          - "@earendil-works/*"
    commit-message:
      prefix: chore
